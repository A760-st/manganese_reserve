services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      FRONTEND_URL: http://localhost:3000
      DATA_MODE: demo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
